name: Validate Repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate scripts and configs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate shell syntax
        run: bash -n scripts/*.sh

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh

      - name: Validate required files
        run: |
          test -f README.md
          test -f ROADMAP.md
          test -f CHANGELOG.md
          test -f docs/deployment.md
          test -f examples/nginx/nuxt.conf
          test -f examples/apache/nuxt-vhost.conf
          test -f examples/systemd/nuxt-app.service
          test -f examples/env/.env.production.example
          test -f scripts/validate-deployment.sh

      - name: Validate executable scripts
        run: |
          test -x scripts/deploy.sh
          test -x scripts/rollback.sh
          test -x scripts/healthcheck.sh
          test -x scripts/validate-deployment.sh
          test -x scripts/rotate-logs.sh
          test -x scripts/cleanup-releases.sh
