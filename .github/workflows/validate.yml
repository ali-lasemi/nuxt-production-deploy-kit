name: Validate Repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate scripts, configs, and deployment behavior
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck nginx apache2 nodejs sudo

      - name: Validate shell syntax
        run: |
          bash -n scripts/*.sh
          bash -n tests/integration/*.sh

      - name: Run ShellCheck
        run: |
          shellcheck scripts/*.sh
          shellcheck tests/integration/*.sh

      - name: Validate runtime dependencies
        run: |
          command -v flock
          command -v find
          command -v sort
          command -v cut
          command -v unzip
          command -v zip
          command -v curl
          command -v sha256sum
          command -v node
          command -v nginx
          command -v apache2ctl
          command -v systemd-analyze
          command -v docker

      - name: Validate required files
        run: |
          test -f README.md
          test -f ROADMAP.md
          test -f CHANGELOG.md
          test -f docs/architecture.md
          test -f docs/deployment.md
          test -f docs/deployment-locking.md
          test -f docs/release-metadata.md
          test -f docs/rollback.md
          test -f docs/ci-configuration-validation.md
          test -f docs/docker-deployment.md
          test -f docs/systemd-security.md
          test -f docs/deployment-user-security.md
          test -f docs/secret-management.md
          test -f examples/nginx/nuxt.conf
          test -f examples/apache/nuxt-vhost.conf
          test -f examples/systemd/nuxt-app.service
          test -f examples/sudoers/nuxt-app-deploy
          test -f examples/env/.env.production.example
          test -f examples/docker/Dockerfile
          test -f examples/docker/docker-compose.yml
          test -f scripts/validate-deployment.sh
          test -f scripts/release-metadata.mjs
          test -f tests/integration/deploy-rollback.sh
          test -f tests/config/systemd-hardening.sh
          test -f tests/config/deployment-permissions.sh
          test -f tests/config/secret-management.sh
          test -f tests/fixtures/docker-app/package.json
          test -f tests/fixtures/docker-app/package-lock.json
          test -f tests/fixtures/docker-app/build.mjs

      - name: Validate executable scripts
        run: |
          test -x scripts/deploy.sh
          test -x scripts/rollback.sh
          test -x scripts/healthcheck.sh
          test -x scripts/validate-deployment.sh
          test -x scripts/rotate-logs.sh
          test -x scripts/cleanup-releases.sh
          test -x scripts/bootstrap-host.sh
          test -x scripts/validate-secret-file.sh
          test -x tests/integration/deploy-rollback.sh
          test -x tests/config/systemd-hardening.sh
          test -x tests/config/deployment-permissions.sh
          test -x tests/config/secret-management.sh

      - name: Validate release metadata tool
        run: node --check scripts/release-metadata.mjs

      - name: Validate Nginx configuration
        run: |
          sudo cp examples/nginx/nuxt.conf /etc/nginx/conf.d/nuxt-app.conf
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t

      - name: Validate Apache configuration
        run: |
          sudo a2enmod proxy
          sudo a2enmod proxy_http
          sudo a2enmod headers
          sudo cp examples/apache/nuxt-vhost.conf /etc/apache2/sites-available/nuxt-app.conf
          sudo a2ensite nuxt-app.conf
          sudo apache2ctl configtest

      - name: Validate systemd service unit
        run: |
          sudo mkdir -p /var/log/nuxt-app
          systemd-analyze verify examples/systemd/nuxt-app.service

      - name: Validate systemd hardening policy
        run: tests/config/systemd-hardening.sh

      - name: Validate deployment sudoers policy
        run: sudo visudo -cf examples/sudoers/nuxt-app-deploy

      - name: Validate deployment identity and permissions policy
        run: tests/config/deployment-permissions.sh

      - name: Validate secret management policy
        run: tests/config/secret-management.sh

      - name: Validate Docker Compose configuration
        working-directory: examples/docker
        run: docker compose config

      - name: Build Docker production image
        run: |
          docker build \
            --file examples/docker/Dockerfile \
            --tag nuxt-production-deploy-kit:test \
            tests/fixtures/docker-app

      - name: Validate Docker runtime user
        run: |
          test "$(docker image inspect nuxt-production-deploy-kit:test --format '{{.Config.User}}')" = "node"

      - name: Run Docker image health smoke test
        run: |
          container_id="$(docker run -d -p 127.0.0.1::3000 nuxt-production-deploy-kit:test)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT

          host_port="$(docker port "$container_id" 3000/tcp | sed 's/.*://')"

          for attempt in $(seq 1 20); do
            if curl --fail --silent "http://127.0.0.1:${host_port}/" >/dev/null; then
              exit 0
            fi

            sleep 1
          done

          docker logs "$container_id"
          exit 1

      - name: Run deployment and rollback integration tests
        run: tests/integration/deploy-rollback.sh