services:
  nuxt:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped
    init: true

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000

    ports:
      - "127.0.0.1:3000:3000"

    read_only: true

    tmpfs:
      - /tmp:size=64m,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 256

    stop_grace_period: 15s

    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - --quiet
        - http://127.0.0.1:3000/
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3